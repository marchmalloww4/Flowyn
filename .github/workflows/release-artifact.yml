name: Release artifact

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable local artifact tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/production.Dockerfile
          tags: flowyn:${{ inputs.image_tag }}
          load: true
          provenance: true
          sbom: true
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: flowyn:${{ inputs.image_tag }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - name: Record immutable artifact metadata
        env:
          IMAGE_REF: flowyn:${{ inputs.image_tag }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          image_id="$(docker image inspect "$IMAGE_REF" --format '{{.Id}}')"
          repo_digests="$(docker image inspect "$IMAGE_REF" --format '{{json .RepoDigests}}')"
          printf '{"image_id":"%s","repo_digests":%s}\n' "$image_id" "$repo_digests" > image-digest.json
          printf 'commit=%s\nimage_ref=%s\nimage_id=%s\n' "$SOURCE_COMMIT" "$IMAGE_REF" "$image_id" > release-metadata.txt
      - uses: actions/upload-artifact@v4
        with:
          name: flowyn-release-${{ github.sha }}
          path: |
            image-digest.json
            release-metadata.txt
