name: flowyn

services:
  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-flowyn-local-development-secret-change-me}
      DATABASE_URL: postgres://flowyn:flowyn@postgres:5432/flowyn
      REDIS_URL: redis://redis:6379
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_EMBEDDING_DIMENSION: ${OLLAMA_EMBEDDING_DIMENSION:-768}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.4}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-800}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-60000}
      MAX_GENERATION_PROMPT_CHARS: ${MAX_GENERATION_PROMPT_CHARS:-12000}
      KNOWLEDGE_CHUNK_SIZE: ${KNOWLEDGE_CHUNK_SIZE:-1200}
      KNOWLEDGE_CHUNK_OVERLAP: ${KNOWLEDGE_CHUNK_OVERLAP:-150}
      MAX_KNOWLEDGE_DOCUMENT_CHARS: ${MAX_KNOWLEDGE_DOCUMENT_CHARS:-200000}
      RAG_MAX_CONTEXT_CHARS: ${RAG_MAX_CONTEXT_CHARS:-8000}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      AGENT_MAX_STEPS_DEFAULT: ${AGENT_MAX_STEPS_DEFAULT:-5}
      AGENT_MAX_STEPS_HARD_LIMIT: ${AGENT_MAX_STEPS_HARD_LIMIT:-12}
      AGENT_TOTAL_TIMEOUT_MS: ${AGENT_TOTAL_TIMEOUT_MS:-120000}
      AGENT_TOOL_TIMEOUT_MS: ${AGENT_TOOL_TIMEOUT_MS:-15000}
      AGENT_MAX_GOAL_CHARS: ${AGENT_MAX_GOAL_CHARS:-4000}
      AGENT_MAX_OBSERVATION_CHARS: ${AGENT_MAX_OBSERVATION_CHARS:-6000}
      AGENT_MAX_FINAL_RESPONSE_CHARS: ${AGENT_MAX_FINAL_RESPONSE_CHARS:-8000}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: flowyn
      POSTGRES_PASSWORD: flowyn
      POSTGRES_DB: flowyn
    ports:
      - "5432:5432"
    volumes:
      - flowyn-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowyn -d flowyn"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - flowyn-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "/opt/flowyn/entrypoint.sh"]
    ports:
      - "11434:11434"
    volumes:
      - flowyn-ollama-data:/root/.ollama
      - ./docker/ollama/entrypoint.sh:/opt/flowyn/entrypoint.sh:ro

volumes:
  flowyn-postgres-data:
  flowyn-redis-data:
  flowyn-ollama-data:
