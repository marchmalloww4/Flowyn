name: flowyn

services:
  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-flowyn-local-development-secret-change-me}
      DATABASE_URL: postgres://flowyn:flowyn@postgres:5432/flowyn
      REDIS_URL: redis://redis:6379
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_EMBEDDING_DIMENSION: ${OLLAMA_EMBEDDING_DIMENSION:-768}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.4}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-1600}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-60000}
      MAX_GENERATION_PROMPT_CHARS: ${MAX_GENERATION_PROMPT_CHARS:-12000}
      KNOWLEDGE_CHUNK_SIZE: ${KNOWLEDGE_CHUNK_SIZE:-1200}
      KNOWLEDGE_CHUNK_OVERLAP: ${KNOWLEDGE_CHUNK_OVERLAP:-150}
      MAX_KNOWLEDGE_DOCUMENT_CHARS: ${MAX_KNOWLEDGE_DOCUMENT_CHARS:-200000}
      RAG_MAX_CONTEXT_CHARS: ${RAG_MAX_CONTEXT_CHARS:-8000}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      AGENT_MAX_STEPS_DEFAULT: ${AGENT_MAX_STEPS_DEFAULT:-5}
      AGENT_MAX_STEPS_HARD_LIMIT: ${AGENT_MAX_STEPS_HARD_LIMIT:-12}
      AGENT_TOTAL_TIMEOUT_MS: ${AGENT_TOTAL_TIMEOUT_MS:-120000}
      AGENT_TOOL_TIMEOUT_MS: ${AGENT_TOOL_TIMEOUT_MS:-15000}
      AGENT_MAX_GOAL_CHARS: ${AGENT_MAX_GOAL_CHARS:-4000}
      AGENT_MAX_OBSERVATION_CHARS: ${AGENT_MAX_OBSERVATION_CHARS:-6000}
      AGENT_MAX_FINAL_RESPONSE_CHARS: ${AGENT_MAX_FINAL_RESPONSE_CHARS:-8000}
      WORKFLOW_MAX_STEPS: ${WORKFLOW_MAX_STEPS:-20}
      WORKFLOW_TOTAL_TIMEOUT_MS: ${WORKFLOW_TOTAL_TIMEOUT_MS:-300000}
      WORKFLOW_STEP_TIMEOUT_MS: ${WORKFLOW_STEP_TIMEOUT_MS:-60000}
      WORKFLOW_MAX_RETRIES: ${WORKFLOW_MAX_RETRIES:-2}
      WORKFLOW_MAX_INPUT_CHARS: ${WORKFLOW_MAX_INPUT_CHARS:-12000}
      WORKFLOW_MAX_OUTPUT_CHARS: ${WORKFLOW_MAX_OUTPUT_CHARS:-16000}
      WORKFLOW_MAX_CONTEXT_CHARS: ${WORKFLOW_MAX_CONTEXT_CHARS:-24000}
      WORKFLOW_DISPATCH_LEASE_MS: ${WORKFLOW_DISPATCH_LEASE_MS:-30000}
      WORKFLOW_EXECUTION_LEASE_MS: ${WORKFLOW_EXECUTION_LEASE_MS:-90000}
      WORKFLOW_WORKER_CONCURRENCY: ${WORKFLOW_WORKER_CONCURRENCY:-1}
      SCHEDULER_POLL_INTERVAL_MS: ${SCHEDULER_POLL_INTERVAL_MS:-5000}
      SCHEDULER_BATCH_SIZE: ${SCHEDULER_BATCH_SIZE:-25}
      SCHEDULER_HEARTBEAT_TTL_SECONDS: ${SCHEDULER_HEARTBEAT_TTL_SECONDS:-30}
      SCHEDULE_MISFIRE_GRACE_SECONDS: ${SCHEDULE_MISFIRE_GRACE_SECONDS:-60}
      SCHEDULE_MIN_INTERVAL_SECONDS: ${SCHEDULE_MIN_INTERVAL_SECONDS:-60}
      SCHEDULE_MAX_INTERVAL_SECONDS: ${SCHEDULE_MAX_INTERVAL_SECONDS:-31536000}
      WEBHOOK_SECRET_ENCRYPTION_KEY: ${WEBHOOK_SECRET_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      WEBHOOK_SECRET_KEY_VERSION: ${WEBHOOK_SECRET_KEY_VERSION:-v1}
      WEBHOOK_REPLAY_WINDOW_SECONDS: ${WEBHOOK_REPLAY_WINDOW_SECONDS:-300}
      WEBHOOK_MAX_BODY_BYTES: ${WEBHOOK_MAX_BODY_BYTES:-262144}
      WEBHOOK_RATE_LIMIT_GLOBAL_PER_MINUTE: ${WEBHOOK_RATE_LIMIT_GLOBAL_PER_MINUTE:-600}
      WEBHOOK_RATE_LIMIT_TRIGGER_PER_MINUTE: ${WEBHOOK_RATE_LIMIT_TRIGGER_PER_MINUTE:-120}
      WEBHOOK_EVENT_RETENTION_DAYS: ${WEBHOOK_EVENT_RETENTION_DAYS:-30}
      WEBHOOK_PUBLIC_BASE_URL: ${WEBHOOK_PUBLIC_BASE_URL:-http://localhost:3000}
      INTEGRATION_EGRESS_ENABLED: ${INTEGRATION_EGRESS_ENABLED:-false}
      INTEGRATION_CREDENTIAL_KEYRING_JSON: '${INTEGRATION_CREDENTIAL_KEYRING_JSON:-{"v1":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="}}'
      INTEGRATION_CREDENTIAL_CURRENT_KEY_VERSION: ${INTEGRATION_CREDENTIAL_CURRENT_KEY_VERSION:-v1}
      INTEGRATION_REQUEST_TIMEOUT_MS: ${INTEGRATION_REQUEST_TIMEOUT_MS:-10000}
      INTEGRATION_MAX_REQUEST_BYTES: ${INTEGRATION_MAX_REQUEST_BYTES:-16384}
      INTEGRATION_MAX_RESPONSE_BYTES: ${INTEGRATION_MAX_RESPONSE_BYTES:-65536}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    command: ["npm", "run", "worker"]
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-flowyn-local-development-secret-change-me}
      DATABASE_URL: postgres://flowyn:flowyn@postgres:5432/flowyn
      REDIS_URL: redis://redis:6379
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_EMBEDDING_DIMENSION: ${OLLAMA_EMBEDDING_DIMENSION:-768}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.4}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-1600}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-60000}
      MAX_GENERATION_PROMPT_CHARS: ${MAX_GENERATION_PROMPT_CHARS:-12000}
      KNOWLEDGE_CHUNK_SIZE: ${KNOWLEDGE_CHUNK_SIZE:-1200}
      KNOWLEDGE_CHUNK_OVERLAP: ${KNOWLEDGE_CHUNK_OVERLAP:-150}
      MAX_KNOWLEDGE_DOCUMENT_CHARS: ${MAX_KNOWLEDGE_DOCUMENT_CHARS:-200000}
      RAG_MAX_CONTEXT_CHARS: ${RAG_MAX_CONTEXT_CHARS:-8000}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      AGENT_MAX_STEPS_DEFAULT: ${AGENT_MAX_STEPS_DEFAULT:-5}
      AGENT_MAX_STEPS_HARD_LIMIT: ${AGENT_MAX_STEPS_HARD_LIMIT:-12}
      AGENT_TOTAL_TIMEOUT_MS: ${AGENT_TOTAL_TIMEOUT_MS:-120000}
      AGENT_TOOL_TIMEOUT_MS: ${AGENT_TOOL_TIMEOUT_MS:-15000}
      AGENT_MAX_GOAL_CHARS: ${AGENT_MAX_GOAL_CHARS:-4000}
      AGENT_MAX_OBSERVATION_CHARS: ${AGENT_MAX_OBSERVATION_CHARS:-6000}
      AGENT_MAX_FINAL_RESPONSE_CHARS: ${AGENT_MAX_FINAL_RESPONSE_CHARS:-8000}
      WORKFLOW_MAX_STEPS: ${WORKFLOW_MAX_STEPS:-20}
      WORKFLOW_TOTAL_TIMEOUT_MS: ${WORKFLOW_TOTAL_TIMEOUT_MS:-300000}
      WORKFLOW_STEP_TIMEOUT_MS: ${WORKFLOW_STEP_TIMEOUT_MS:-60000}
      WORKFLOW_MAX_RETRIES: ${WORKFLOW_MAX_RETRIES:-2}
      WORKFLOW_MAX_INPUT_CHARS: ${WORKFLOW_MAX_INPUT_CHARS:-12000}
      WORKFLOW_MAX_OUTPUT_CHARS: ${WORKFLOW_MAX_OUTPUT_CHARS:-16000}
      WORKFLOW_MAX_CONTEXT_CHARS: ${WORKFLOW_MAX_CONTEXT_CHARS:-24000}
      WORKFLOW_DISPATCH_LEASE_MS: ${WORKFLOW_DISPATCH_LEASE_MS:-30000}
      WORKFLOW_EXECUTION_LEASE_MS: ${WORKFLOW_EXECUTION_LEASE_MS:-90000}
      WORKFLOW_WORKER_CONCURRENCY: ${WORKFLOW_WORKER_CONCURRENCY:-1}
      SCHEDULER_POLL_INTERVAL_MS: ${SCHEDULER_POLL_INTERVAL_MS:-5000}
      SCHEDULER_BATCH_SIZE: ${SCHEDULER_BATCH_SIZE:-25}
      SCHEDULER_HEARTBEAT_TTL_SECONDS: ${SCHEDULER_HEARTBEAT_TTL_SECONDS:-30}
      SCHEDULE_MISFIRE_GRACE_SECONDS: ${SCHEDULE_MISFIRE_GRACE_SECONDS:-60}
      SCHEDULE_MIN_INTERVAL_SECONDS: ${SCHEDULE_MIN_INTERVAL_SECONDS:-60}
      SCHEDULE_MAX_INTERVAL_SECONDS: ${SCHEDULE_MAX_INTERVAL_SECONDS:-31536000}
      WEBHOOK_SECRET_ENCRYPTION_KEY: ${WEBHOOK_SECRET_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      WEBHOOK_SECRET_KEY_VERSION: ${WEBHOOK_SECRET_KEY_VERSION:-v1}
      WEBHOOK_REPLAY_WINDOW_SECONDS: ${WEBHOOK_REPLAY_WINDOW_SECONDS:-300}
      WEBHOOK_MAX_BODY_BYTES: ${WEBHOOK_MAX_BODY_BYTES:-262144}
      WEBHOOK_RATE_LIMIT_GLOBAL_PER_MINUTE: ${WEBHOOK_RATE_LIMIT_GLOBAL_PER_MINUTE:-600}
      WEBHOOK_RATE_LIMIT_TRIGGER_PER_MINUTE: ${WEBHOOK_RATE_LIMIT_TRIGGER_PER_MINUTE:-120}
      WEBHOOK_EVENT_RETENTION_DAYS: ${WEBHOOK_EVENT_RETENTION_DAYS:-30}
      WEBHOOK_PUBLIC_BASE_URL: ${WEBHOOK_PUBLIC_BASE_URL:-http://localhost:3000}
      INTEGRATION_EGRESS_ENABLED: ${INTEGRATION_EGRESS_ENABLED:-false}
      INTEGRATION_CREDENTIAL_KEYRING_JSON: '${INTEGRATION_CREDENTIAL_KEYRING_JSON:-{"v1":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="}}'
      INTEGRATION_CREDENTIAL_CURRENT_KEY_VERSION: ${INTEGRATION_CREDENTIAL_CURRENT_KEY_VERSION:-v1}
      INTEGRATION_REQUEST_TIMEOUT_MS: ${INTEGRATION_REQUEST_TIMEOUT_MS:-10000}
      INTEGRATION_MAX_REQUEST_BYTES: ${INTEGRATION_MAX_REQUEST_BYTES:-16384}
      INTEGRATION_MAX_RESPONSE_BYTES: ${INTEGRATION_MAX_RESPONSE_BYTES:-65536}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "npm run worker:health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  scheduler:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    command: ["npm", "run", "scheduler"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://flowyn:flowyn@postgres:5432/flowyn
      REDIS_URL: redis://redis:6379
      WORKFLOW_MAX_STEPS: ${WORKFLOW_MAX_STEPS:-20}
      WORKFLOW_TOTAL_TIMEOUT_MS: ${WORKFLOW_TOTAL_TIMEOUT_MS:-300000}
      WORKFLOW_STEP_TIMEOUT_MS: ${WORKFLOW_STEP_TIMEOUT_MS:-60000}
      WORKFLOW_MAX_RETRIES: ${WORKFLOW_MAX_RETRIES:-2}
      WORKFLOW_MAX_INPUT_CHARS: ${WORKFLOW_MAX_INPUT_CHARS:-12000}
      WORKFLOW_MAX_OUTPUT_CHARS: ${WORKFLOW_MAX_OUTPUT_CHARS:-16000}
      WORKFLOW_MAX_CONTEXT_CHARS: ${WORKFLOW_MAX_CONTEXT_CHARS:-24000}
      WORKFLOW_DISPATCH_LEASE_MS: ${WORKFLOW_DISPATCH_LEASE_MS:-30000}
      WORKFLOW_EXECUTION_LEASE_MS: ${WORKFLOW_EXECUTION_LEASE_MS:-90000}
      WORKFLOW_WORKER_CONCURRENCY: ${WORKFLOW_WORKER_CONCURRENCY:-1}
      SCHEDULER_POLL_INTERVAL_MS: ${SCHEDULER_POLL_INTERVAL_MS:-5000}
      SCHEDULER_BATCH_SIZE: ${SCHEDULER_BATCH_SIZE:-25}
      SCHEDULER_HEARTBEAT_TTL_SECONDS: ${SCHEDULER_HEARTBEAT_TTL_SECONDS:-30}
      SCHEDULE_MISFIRE_GRACE_SECONDS: ${SCHEDULE_MISFIRE_GRACE_SECONDS:-60}
      SCHEDULE_MIN_INTERVAL_SECONDS: ${SCHEDULE_MIN_INTERVAL_SECONDS:-60}
      SCHEDULE_MAX_INTERVAL_SECONDS: ${SCHEDULE_MAX_INTERVAL_SECONDS:-31536000}
      WEBHOOK_SECRET_ENCRYPTION_KEY: ${WEBHOOK_SECRET_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      WEBHOOK_SECRET_KEY_VERSION: ${WEBHOOK_SECRET_KEY_VERSION:-v1}
      WEBHOOK_REPLAY_WINDOW_SECONDS: ${WEBHOOK_REPLAY_WINDOW_SECONDS:-300}
      WEBHOOK_MAX_BODY_BYTES: ${WEBHOOK_MAX_BODY_BYTES:-262144}
      WEBHOOK_RATE_LIMIT_GLOBAL_PER_MINUTE: ${WEBHOOK_RATE_LIMIT_GLOBAL_PER_MINUTE:-600}
      WEBHOOK_RATE_LIMIT_TRIGGER_PER_MINUTE: ${WEBHOOK_RATE_LIMIT_TRIGGER_PER_MINUTE:-120}
      WEBHOOK_EVENT_RETENTION_DAYS: ${WEBHOOK_EVENT_RETENTION_DAYS:-30}
      WEBHOOK_PUBLIC_BASE_URL: ${WEBHOOK_PUBLIC_BASE_URL:-http://localhost:3000}
      INTEGRATION_EGRESS_ENABLED: ${INTEGRATION_EGRESS_ENABLED:-false}
      INTEGRATION_CREDENTIAL_KEYRING_JSON: '${INTEGRATION_CREDENTIAL_KEYRING_JSON:-{"v1":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="}}'
      INTEGRATION_CREDENTIAL_CURRENT_KEY_VERSION: ${INTEGRATION_CREDENTIAL_CURRENT_KEY_VERSION:-v1}
      INTEGRATION_REQUEST_TIMEOUT_MS: ${INTEGRATION_REQUEST_TIMEOUT_MS:-10000}
      INTEGRATION_MAX_REQUEST_BYTES: ${INTEGRATION_MAX_REQUEST_BYTES:-16384}
      INTEGRATION_MAX_RESPONSE_BYTES: ${INTEGRATION_MAX_RESPONSE_BYTES:-65536}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "npm run scheduler:health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: flowyn
      POSTGRES_PASSWORD: flowyn
      POSTGRES_DB: flowyn
    ports:
      - "5432:5432"
    volumes:
      - flowyn-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowyn -d flowyn"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - flowyn-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "/opt/flowyn/entrypoint.sh"]
    ports:
      - "11434:11434"
    volumes:
      - flowyn-ollama-data:/root/.ollama
      - ./docker/ollama/entrypoint.sh:/opt/flowyn/entrypoint.sh:ro

volumes:
  flowyn-postgres-data:
  flowyn-redis-data:
  flowyn-ollama-data:
